name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar deps de prueba
        run: pip install -r requirements-dev.txt
      - name: Ejecutar suites Python
        run: pytest

  java:
    name: Tests Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar tests Maven (sin integración)
        working-directory: web
        run: mvn -B test -Dgroups='!integracion'
      - name: Tests de integración (Python + evaluador)
        working-directory: web
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3
          mvn -B test -Dgroups=integracion
