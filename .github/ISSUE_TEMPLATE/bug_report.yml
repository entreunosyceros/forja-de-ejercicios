name: Informe de error
description: Algo no funciona como debería en Forja de ejercicios
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un error. Cuanta más información des, más fácil será reproducirlo.
        No incluyas claves API de Gemini, contraseñas ni datos personales de alumnos.

        Consulta antes [Problemas frecuentes](https://github.com/entreunosyceros/forja-de-ejercicios/blob/main/doc_app/problemas-frecuentes.md).

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Instalación (install.sh / install.bat / install.ps1)
        - Arranque web (iniciar-forja / Spring Boot / puerto 8080)
        - Login / perfil / contraseñas
        - Generación de ejercicios (generador.py / módulos clásicos)
        - Corrección / evaluador / nota / retroalimentación
        - Apuntes PDF + indexación (indexador_docs.py)
        - Gemini / ejercicios docs_*
        - Banco de ejercicios (importar / exportar / guardar)
        - Zona profesor (/profesor/revisar, /profesor/alumnos, /profesor/resultados)
        - Docker de práctica (contenedor practica)
        - Resaltado de sintaxis / editor de código
        - Estadísticas / progreso / entregas JSON
        - Otro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: Tag de release o hash de commit si ejecutas desde código fuente
      placeholder: "main @ abc1234"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Lista numerada de acciones hasta ver el fallo
      placeholder: |
        1. Arrancar con ./iniciar-forja.sh
        2. Entrar como alumno / practica
        3. Elegir módulo POO
        4. Enviar respuesta
        5. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Salida de consola, traceback Java/Python o capturas (sin datos sensibles)
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Linux (install.sh / iniciar-forja.sh)
        - macOS (install.sh / iniciar-forja.sh)
        - Windows (install.bat / iniciar-forja.bat)
        - Manual (mvn spring-boot:run / java -jar)
        - Docker (solo contenedor practica)
        - No lo sé
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Versión de Java (si aplica)
      placeholder: "JDK 21"

  - type: input
    id: python
    attributes:
      label: Versión de Python (si aplica)
      placeholder: "3.12.x"

  - type: input
    id: modulo
    attributes:
      label: Módulo afectado (si aplica)
      placeholder: "poo, docs_docker, banco_poo, ..."

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmación
      options:
        - label: He buscado en issues abiertas y cerradas y no he encontrado un duplicado
          required: true
