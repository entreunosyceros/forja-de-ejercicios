<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contenido" id="zona-practica"
     th:with="origen=${@parametros.origenApuntes(escenario.parametros)}"
     th:attr="data-modulo=${escenario.modulo},
              data-ejercicio-id=${escenario.id},
              data-dificultad=${escenario.dificultad},
              data-capitulo=${origen != null ? origen['capitulo_slug'] : ''},
              data-seccion=${origen != null ? origen['seccion_slug'] : ''}">
    <div class="exam-header">
        <span class="badge" th:text="${escenario.modulo}">modulo</span>
        <span class="badge badge-nivel" th:if="${escenario.dificultad != null}"
              th:text="'Nivel ' + ${escenario.dificultad}">Nivel</span>
        <h1 th:text="${escenario.titulo}">Título</h1>
        <p class="exam-meta" th:if="${escenario.usuario != null or escenario.fechaHora != null}">
            <span th:if="${escenario.usuario != null}">Alumno: <strong th:text="${escenario.usuario}">alumno</strong></span>
            <span th:if="${escenario.usuario != null and escenario.fechaHora != null}"> · </span>
            <span th:if="${escenario.fechaHora != null}">Inicio: <strong th:text="${escenario.fechaHora}">01/01/2026 10:00</strong></span>
        </p>
        <p class="exam-id">ID: <code th:text="${escenario.id}">abc</code></p>
    </div>

    <div class="barra-practica card">
        <span class="temporizador" id="temporizador" aria-live="polite">⏱ 00:00</span>
        <span class="hint">Tiempo orientativo (sin penalización)</span>
    </div>

    <article class="card enunciado-card">
        <h2>Enunciado</h2>
        <pre class="enunciado" th:text="${escenario.enunciado}">...</pre>
    </article>

    <article class="card" th:if="${modoProfesor}">
        <h2>Solución (modo profesor)</h2>
        <pre class="solucion-profesor" th:text="${@texto.plano(escenario.solucionReferencia)}">...</pre>
    </article>

    <article class="card">
        <h2>Tu solución</h2>
        <p class="hint">Escribe los comandos o el código que usarías en la práctica.</p>
        <form id="formulario-ejercicio" class="formulario-ejercicio"
              th:attr="data-action-evaluar=@{/ejercicio/{id}/evaluar-ajax(id=${escenario.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <textarea name="respuesta" id="textarea-respuesta" rows="14" required
                      placeholder="Tu respuesta..."></textarea>
            <input type="hidden" name="tiempoSegundos" id="input-tiempo-segundos" value="0"/>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enviar y corregir</button>
                <button type="button" class="btn btn-secondary btn-otro-ejercicio"
                        th:attr="data-modulo=${escenario.modulo}">Otro ejercicio (mismo módulo)</button>
                <a class="btn btn-ghost" th:href="@{/ejercicio/{id}/pdf(id=${escenario.id})}">PDF enunciado</a>
                <a class="btn btn-ghost" th:if="${modoProfesor}" th:href="@{/ejercicio/{id}/json(id=${escenario.id})}">JSON (profesor)</a>
                <a class="btn btn-ghost" th:if="${modoProfesor}"
                   th:href="@{/ejercicio/{id}/exportar-banco.json(id=${escenario.id})}">Exportar para compartir</a>
            </div>
        </form>
    </article>
</div>
</body>
</html>
