<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="formulario"
      class="form-nivel-gemini"
      method="post"
      th:action="@{/perfil/nivel-gemini}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label class="label-nivel-gemini" for="nivel-gemini-select">Dificultad de ejercicios</label>
    <p class="hint">
        Se adapta sola: <strong>5 aprobados seguidos</strong> suben nivel;
        <strong>3 suspensos seguidos</strong> lo bajan (1–3).
        También puedes fijarla aquí (afecta a todos los módulos y a la IA en <code>docs_*</code>).
    </p>

    <div class="nivel-gemini-opciones">
        <label class="nivel-gemini-opcion">
            <input type="radio" name="nivelGemini" value="1" th:checked="${nivelGemini == 1}"/>
            <span class="nivel-gemini-etiqueta">
                <strong>1 — Fácil</strong>
                <span class="hint">Guiado, menos exigente</span>
            </span>
        </label>
        <label class="nivel-gemini-opcion">
            <input type="radio" name="nivelGemini" value="2" th:checked="${nivelGemini == 2}"/>
            <span class="nivel-gemini-etiqueta">
                <strong>2 — Intermedio</strong>
                <span class="hint">Equilibrado (por defecto)</span>
            </span>
        </label>
        <label class="nivel-gemini-opcion">
            <input type="radio" name="nivelGemini" value="3" th:checked="${nivelGemini == 3}"/>
            <span class="nivel-gemini-etiqueta">
                <strong>3 — Exigente</strong>
                <span class="hint">Más detalle y sin ayudas extra</span>
            </span>
        </label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-secondary btn-sm">Guardar nivel</button>
    </div>
</form>
</body>
</html>
