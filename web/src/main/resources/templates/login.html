<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="color-scheme" content="light dark"/>
    <title>Entrar — Forja de ejercicios</title>
    <link rel="icon" type="image/png" th:href="@{/img/forja-de-examenes.png}"/>
    <link rel="stylesheet" th:href="@{/css/aplicacion.css(v=6)}"/>
</head>
<body class="pagina-login">
<main class="container login-wrap">
    <div class="card login-card">
        <img class="login-logo" th:src="@{/img/forja-de-examenes.png}" alt="Forja de ejercicios" width="120" height="60"/>
        <h1>Entrar</h1>
        <p class="hint">Identifícate para que tus ejercicios queden con tu nombre y la fecha.</p>

        <p class="alerta-indexacion alerta-error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
        <p class="alerta-indexacion alerta-ok" th:if="${param.logout}">Sesión cerrada correctamente.</p>
        <p class="alerta-indexacion alerta-ok" th:if="${mensajePerfil}" th:text="${mensajePerfil}">Perfil</p>

        <form class="form-login" method="post" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus/>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required/>

            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <p class="login-ayuda">
            <a class="btn btn-ghost btn-block" th:href="@{/como-funciona}">¿Cómo funciona el programa?</a>
        </p>

        <p class="hint hint-login">
            Alumno: <code>alumno</code> / <code>practica</code> o <code>demo</code> / <code>demo</code><br/>
            Profesor: <code>profesor</code> / <code>profesor</code> (revisión del banco y paquetes de entrega)
        </p>
    </div>
</main>
<script th:src="@{/js/tema.js}"></script>
</body>
</html>
