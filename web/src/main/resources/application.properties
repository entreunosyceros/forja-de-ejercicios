spring.application.name=forjaexamenes
server.port=8080

forjaexamenes.raiz=${FORJAEXAMENES_RAIZ:../}
forjaexamenes.directorio-examenes=${forjaexamenes.raiz}/examenes
forjaexamenes.script-generador=${forjaexamenes.raiz}/generador.py
forjaexamenes.script-evaluador=${forjaexamenes.raiz}/evaluador.py

spring.thymeleaf.cache=false

# Modo profesor: muestra solución antes de enviar y en el desplegable (FORJAEXAMENES_MODO_PROFESOR=true)
forjaexamenes.modo-profesor=${FORJAEXAMENES_MODO_PROFESOR:false}
