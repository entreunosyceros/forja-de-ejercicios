spring.application.name=forjaexamenes
server.port=8080

# Solo cookie: sin ;jsessionid= en redirects (tras «Actualizar apuntes» el GET a /;jsessionid=… fallaba)
server.servlet.session.tracking-modes=cookie

forjaexamenes.raiz=${FORJAEXAMENES_RAIZ:../}

# GEMINI_API_KEY desde examenforge/.env (ruta relativa a forjaexamenes.raiz)
spring.config.import=optional:file:${forjaexamenes.raiz}/.env[.properties]
forjaexamenes.directorio-examenes=${forjaexamenes.raiz}/examenes
forjaexamenes.script-generador=${forjaexamenes.raiz}/generador.py
forjaexamenes.script-evaluador=${forjaexamenes.raiz}/evaluador.py
forjaexamenes.directorio-documentacion=${forjaexamenes.raiz}/documentacion
forjaexamenes.directorio-indice=${forjaexamenes.raiz}/indice
forjaexamenes.directorio-datos=${forjaexamenes.raiz}/datos
forjaexamenes.gemini-api-key=${GEMINI_API_KEY:${FORJAEXAMENES_GEMINI_API_KEY:}}
forjaexamenes.gemini-model=${FORJAEXAMENES_GEMINI_MODEL:gemini-2.5-flash}
forjaexamenes.script-indexador=${forjaexamenes.raiz}/indexador_docs.py
# Al arrancar, indexa PDFs nuevos en documentacion/ → docs_* sin pasos manuales
forjaexamenes.auto-indexar-documentacion=${FORJAEXAMENES_AUTO_INDEXAR:true}

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=120MB

forjaexamenes.subida-pdf-max-mb=${FORJAEXAMENES_SUBIDA_PDF_MAX_MB:30}
forjaexamenes.limpiar-practica-al-nuevo-ejercicio=${FORJAEXAMENES_LIMPIAR_PRACTICA:true}

# Modo profesor: muestra solución antes de enviar y en el desplegable (FORJAEXAMENES_MODO_PROFESOR=true)
forjaexamenes.modo-profesor=${FORJAEXAMENES_MODO_PROFESOR:false}

forjaexamenes.directorio-banco=${forjaexamenes.raiz}/banco
forjaexamenes.gemini-guardar-pendientes=${FORJAEXAMENES_GEMINI_GUARDAR_PENDIENTES:false}
forjaexamenes.gemini-solo-aprobados=${FORJAEXAMENES_GEMINI_SOLO_APROBADOS:false}

# Login: usuario:contraseña separados por coma (FORJAEXAMENES_USUARIOS)
forjaexamenes.login.usuarios=${FORJAEXAMENES_USUARIOS:alumno:practica,demo:demo,profesor:profesor}
forjaexamenes.login.profesores=${FORJAEXAMENES_PROFESORES:profesor}
